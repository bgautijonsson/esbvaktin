name: CI

on:
  push:
    branches: [main, pipeline-optimisation]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC — catches time-dependent bugs

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check src/ scripts/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: esbvaktin
          POSTGRES_USER: esb
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://esb:localdev@localhost:5432/esbvaktin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run python scripts/init_db.py
      - run: uv run python -m pytest

  icelandic-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra icelandic --extra eval
      - name: Gate correction quality (goldens — fp_rate; voice lands in a later milestone)
        run: |
          uv run python -m iseval gate \
            --product esbvaktin --family correction \
            --adapter eval.iseval_adapter:EsbvaktinAdapter \
            --golden eval/golden \
            --baseline eval/baseline.json \
            --gate-config eval/gate.json
